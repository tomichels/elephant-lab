name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: ['*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # yarn.lock is not committed, so yarn must be allowed to create it on CI
  YARN_ENABLE_IMMUTABLE_INSTALLS: false
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Base setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
        with:
          python_version: '3.12'

      - name: Install build dependencies
        run: python -m pip install -U "jupyterlab>=4.0.0,<5" build

      - name: Build the extension
        run: |
          jlpm install
          jlpm build:prod

      - name: Install the extension
        run: python -m pip install .

      - name: Check the extension is installed
        run: |
          jupyter labextension list
          jupyter labextension list 2>&1 | grep -ie "elephant-lab.*OK"
          python -m jupyterlab.browser_check

      - name: Package the extension
        run: |
          pip uninstall -y elephant-lab
          python -m build

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: elephant-lab-dist-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

  python-tests:
    name: Python tests (py${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: elephant-lab-dist-${{ github.run_number }}
          path: dist

      # Install the built wheel (not the source tree) so the tests also verify the release artifact
      - name: Install the wheel with test dependencies
        run: |
          WHEEL=$(ls dist/*.whl)
          python -m pip install "${WHEEL}[test]"

      - name: Run pytest
        # Run from a temp dir so the installed package is imported, not the checkout
        working-directory: ${{ runner.temp }}
        run: >
          python -m pytest ${{ github.workspace }}/tests --import-mode=importlib
          --cov=elephant_lab --cov-report=term --cov-report=xml:${{ github.workspace }}/coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

  integration-tests:
    name: Integration tests (Playwright)
    needs: build
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers
    steps:
      - uses: actions/checkout@v4

      - name: Base setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
        with:
          python_version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: elephant-lab-dist-${{ github.run_number }}
          path: dist

      - name: Install the extension
        run: |
          set -eux
          python -m pip install "jupyterlab>=4.0.0,<5" dist/*.whl

      - name: Install test dependencies
        working-directory: ui-tests
        run: jlpm install

      - name: Set up browser cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/pw-browsers
          key: ${{ runner.os }}-pw-${{ hashFiles('ui-tests/package.json') }}

      - name: Install browsers
        working-directory: ui-tests
        run: jlpm playwright install --with-deps chromium firefox

      - name: Execute integration tests
        working-directory: ui-tests
        run: jlpm playwright test

      - name: Upload Playwright test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elephant-lab-playwright-tests
          path: |
            ui-tests/test-results
            ui-tests/playwright-report
